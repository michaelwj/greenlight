# Greenlight — self-hosted stack.
# Quick start: ./setup.sh   (or copy backend/.env.example to backend/.env and
# `docker compose up -d --build` yourself).
#
# The API listens on http://<host>:${API_PORT:-8080}
#   Kid portal:    /kid/
#   Parent app:    /parent/
#
# MEDIA_ROOT is the host folder your Plex library reads from.

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: greenlight
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env or the shell}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Not published to the host: reachable only inside the compose network.

  redis:
    image: redis:7
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env
    depends_on:
      - db
      - redis
    ports:
      - "${API_PORT:-8080}:8000"
    volumes:
      - ${MEDIA_ROOT:-./media}:/media/greenlight

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env
    depends_on:
      - redis
      - db
    command: python -m app.workers.worker
    volumes:
      - ${MEDIA_ROOT:-./media}:/media/greenlight

  scheduler:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env
    depends_on:
      - redis
      - db
    command: python -m app.workers.scheduler

volumes:
  postgres_data:

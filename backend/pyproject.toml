[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "greenlight-backend"
version = "0.1.0"
description = "Greenlight — a self-hosted, parent-screened YouTube-to-Plex pipeline for families"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14.0",
  "anthropic>=0.116.0",
  "asyncpg>=0.30.0",
  "fastapi>=0.116.0",
  "httpx>=0.28.1",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.8.0",
  "pywebpush>=2.0.0",
  "python-dotenv>=1.0.1",
  "redis>=5.2.0",
  "rq>=1.16.2",
  "sqlalchemy>=2.0.36",
  "uvicorn[standard]>=0.34.0",
  "yt-dlp[default,curl-cffi]>=2026.8.19",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.20.0",
  "httpx>=0.28.0",
  "pytest>=8.3.4",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.9.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.setuptools]
packages = ["app"]
